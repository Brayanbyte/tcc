<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área Administrativa - NutriMarket</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <i class="fas fa-leaf"></i>
        NutriMarket
      </a>
<ul class="nav-links">
        <li><a href="index.html">Início</a></li>
        <li><a href="loja.html">Loja</a></li>
        <li class="nav-auth-item">
          <a href="#" class="login-btn">
            <i class="fas fa-sign-in-alt"></i> Entrar
          </a>
        </li>
        <li><a href="admin.html">Admin</a></li>
        <li><a href="carrinho.html" class="cart-icon">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-count" id="cartCount">0</span>
        </a></li>
      </ul>
      <button class="mobile-menu-btn" onclick="toggleMenu()">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <div class="section-title">
        <h2><i class="fas fa-cog"></i> Área Administrativa</h2>
        <p>Cadastre, edite e gerencie os produtos da loja.</p>
      </div>

      <div class="card" style="margin-bottom:40px;">
        <h3 class="card-title" id="formTitle">Novo Produto</h3>
        <form id="produtoForm" onsubmit="salvarProduto(event)">
          <input type="hidden" id="produtoId">
          <div class="grid grid-2">
            <div class="form-group">
              <label>Nome do Produto</label>
              <input type="text" id="pNome" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Categoria</label>
              <select id="pCategoria" class="form-control" required>
                <option value="whey">Whey Protein</option>
                <option value="creatina">Creatina</option>
                <option value="pre-treino">Pré-treino</option>
                <option value="vitamina">Vitaminas</option>
              </select>
            </div>
          <div class="grid grid-2">
            <div class="form-group">
              <label>Preço (R$)</label>
              <input type="number" id="pPreco" class="form-control" step="0.01" min="0" required>
            </div>
            <div class="form-group">
              <label>Imagem URL</label>
              <input type="url" id="pImagem" class="form-control" placeholder="https://..." required>
            </div>
          <div class="form-group">
            <label>Descrição</label>
            <textarea id="pDescricao" class="form-control" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label>Objetivos Compatíveis (separados por vírgula)</label>
            <input type="text" id="pObjetivos" class="form-control" placeholder="perda, ganho, manutencao" required>
          </div>
          <div style="display:flex; gap:15px;">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i> Salvar Produto
            </button>
            <button type="button" onclick="limparForm()" class="btn btn-outline">
              <i class="fas fa-eraser"></i> Limpar
            </button>
          </div>
        </form>
      </div>

      <h3 style="margin-bottom:20px; color:var(--dark-blue);">Produtos Cadastrados</h3>
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Imagem</th>
              <th>Nome</th>
              <th>Categoria</th>
              <th>Preço</th>
              <th>Objetivos</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="produtosTableBody">
            
          </tbody>
        </table>
      </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border-top:none;padding-top:0;">
        <p> NutriMarket. Todos os direitos reservados.</p>
      </div>
  </footer>

<script src="js/admin.js"></script>
  <script src="js/login.js"></script>
  <script>
    // Proteção extra para admin
    document.addEventListener('DOMContentLoaded', function() {
      const auth = obterAuth ? obterAuth() : { loggedIn: false };
      if (!auth.loggedIn || auth.role !== 'admin') {
        mostrarAlert('Acesso NEGADO à área administrativa. Faça login como admin primeiro.', 'warning');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2500);
        document.body.innerHTML = '<div style="text-align:center;padding:50px;"><h2>Acesso Restrito</h2><p>Redirecionando...</p></div>';
        return;
      }
    });

    function toggleMenu() {
      const nav = document.querySelector('.nav-links');
      nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
      if (nav.style.display === 'flex') {
        nav.style.position = 'absolute';
        nav.style.top = '60px';
        nav.style.left = '0';
        nav.style.right = '0';
        nav.style.flexDirection = 'column';
        nav.style.background = 'var(--dark-blue)';
        nav.style.padding = '20px';
      }
    }
  </script>
</body>
</html>
