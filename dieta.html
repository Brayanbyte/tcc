<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plano Alimentar - NutriMarket</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <i class="fas fa-leaf"></i>
        NutriMarket
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Início</a></li>
        <li><a href="loja.html">Loja</a></li>
        <li><a href="carrinho.html" class="cart-icon">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-count" id="cartCount">0</span>
        </a></li>
      </ul>
      <button class="mobile-menu-btn" onclick="toggleMenu()">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <div class="section-title">
        <h2><i class="fas fa-utensils"></i> Seu Plano Alimentar Personalizado</h2>
        <p>Baseado no seu perfil e objetivo, preparamos este plano para ajudar você a alcançar seus resultados.</p>
      </div>

      <div id="dietaContent">
       
      </div>

      <div style="text-align:center; margin-top:30px;">
        <button onclick="gerarPDF()" class="btn btn-primary btn-lg">
          <i class="fas fa-file-pdf"></i> Salvar Plano em PDF
        </button>
        <a href="loja.html" class="btn btn-accent btn-lg" style="margin-left:15px;">
          <i class="fas fa-shopping-bag"></i> Ver Suplementos Recomendados
        </a>
      </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border-top:none;padding-top:0;">
        <p> NutriMarket. Todos os direitos reservados.</p>
      </div>
  </footer>

  <script src="js/dieta.js"></script>
  <script>
    function toggleMenu() {
      const nav = document.querySelector('.nav-links');
      nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
      if (nav.style.display === 'flex') {
        nav.style.position = 'absolute';
        nav.style.top = '60px';
        nav.style.left = '0';
        nav.style.right = '0';
        nav.style.flexDirection = 'column';
        nav.style.background = 'var(--dark-blue)';
        nav.style.padding = '20px';
      }
    }
  </script>
</body>
</html>
