<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Suplementos - NutriMarket</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="logo">
      <i class="fas fa-leaf"></i>
      NutriMarket
    </a>

    <ul class="nav-links">
      <li><a href="index.html">Início</a></li>
      <li><a href="loja.html">Loja</a></li>
      <li><a href="carrinho.html" class="cart-icon">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" id="cartCount">0</span>
      </a></li>
    </ul>
  </div>
</nav>

<section class="section">
  <div class="container">

    <div class="section-title">
      <h2><i class="fas fa-store"></i> Loja de Suplementos</h2>
      <p>Os melhores suplementos para o seu objetivo.</p>
    </div>

    <!-- RECOMENDADOS -->
    <div id="recomendadosArea" style="margin-bottom:40px; display:none;">
      <h3 style="color:var(--accent-orange);margin-bottom:20px;">
        ⭐ Recomendados para você
      </h3>
      <div class="grid grid-4" id="recomendadosGrid"></div>
    </div>

    <!-- BUSCA -->
    <div class="search-bar">
      <div class="search-input">
        <input type="text" id="searchInput" class="form-control" placeholder="Buscar..." onkeyup="filtrarProdutos()">
      </div>

      <div class="filter-group">
        <select id="categoriaFilter" class="form-control" onchange="filtrarProdutos()">
          <option value="">Todas</option>
          <option value="whey">Whey</option>
          <option value="creatina">Creatina</option>
        </select>

        <select id="precoFilter" class="form-control" onchange="filtrarProdutos()">
          <option value="">Preço</option>
          <option value="menor">Menor</option>
          <option value="maior">Maior</option>
        </select>
      </div>
    </div>

    <!-- PRODUTOS -->
    <div id="produtosGrid" class="grid grid-4"></div>

  </div>
</section>

<footer class="footer">
  <div class="container">
    <p style="text-align:center;">NutriMarket ©</p>
  </div>
</footer>

<script src="js/loja.js"></script>

</body>
</html>
